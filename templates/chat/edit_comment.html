{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-secondary text-white">
                    <h5 class="mb-0">Edit Comment</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="commentContent" class="form-label text-muted small">Update your comment:</label>
                            <textarea name="content" 
                                      id="commentContent" 
                                      class="form-control" 
                                      rows="3" 
                                      required>{{ comment.content }}</textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{% url 'group_posts' comment.post.group.id %}" class="text-decoration-none text-muted">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-success">
                                Update Comment
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
