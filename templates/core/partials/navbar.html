  /* Floating Sidebar */
.aura-sidebar {

    flex-direction: column;

    box-shadow:

      0 0 0 1px rgba(255, 255, 255, 0.8) inset;
  }

  .nav-item {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;

    height: 48px;
    border-radius: 24px;

    color: #4f6af5;

  .nav-item.is-active {
    background: #4f6af5;
    color: white;
    box-shadow: 0 8px 16px -4px rgba(79, 106, 245, 0.3);
  }

  .nav-item.is-active:hover {

  }

  .nav-icon {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 22px;
    height: 22px;
  }

    width: 22px;
    height: 22px;
    stroke: currentColor;

    right: -4px;
    top: 50%;
    transform: translateY(-50%);

    height: 4px;
    border-radius: 50%;
