{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Add New Interest Category</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="{{ form.name.id_for_label }}" class="form-label">Interest Name</label>
                            {{ form.name }}
                            <div class="form-text">Example: Machine Learning, Photography, Calculus.</div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Create Interest</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
