{% load static %}

{% load crispy_forms_tags %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login - StudySync{% endblock %}</title>

    <!-- Bootstrap CSS (keeping for grid compatibility) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Custom CSS (overrides Bootstrap) -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #1e3a5f;
            --navy-light: #2d4b75;
            --navy-subtle: rgba(30, 58, 95, 0.05);
            --navy-soft: rgba(30, 58, 95, 0.03);
            --cream: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --border-light: #e2e8f0;
            --border-elegant: rgba(30, 58, 95, 0.2);
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Inter', sans-serif;
            --shadow-soft: 0 4px 12px rgba(0, 0, 0, 0.02);
            --shadow-bento: 0 8px 24px rgba(30, 58, 95, 0.06);
            --bento-radius: 24px;
        }

        body {
            background: linear-gradient(135deg, #f1f5f9 0%, #eef2f6 100%);
            font-family: var(--font-sans);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
        }

        .login-container {
            max-width: 400px;
            width: 100%;
        }

        /* Compact Bento Card */
        .bento-card {
            background: white;
            border-radius: var(--bento-radius);
            padding: 2rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-bento);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .bento-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--navy), var(--navy-light));
            opacity: 0.8;
        }

        /* Compact Header */
        .bento-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .bento-header-icon {
            width: 56px;
            height: 56px;
            background: var(--navy-subtle);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.8rem;
            border: 1px solid var(--border-elegant);
        }

        .bento-header-icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--navy);
        }

        .bento-header h2 {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 500;
            color: var(--navy);
            margin-bottom: 0.2rem;
            letter-spacing: -0.02em;
        }

        .bento-header p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin: 0;
        }

        /* Compact Form Fields */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .form-label svg {
            width: 0.9rem;
            height: 0.9rem;
            stroke: var(--navy);
            opacity: 0.8;
        }

        /* Elegant Input Fields */
        .form-control {
            width: 100%;
            padding: 0.8rem 1.2rem;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 0.9rem;
            font-family: var(--font-sans);
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--navy);
            background: white;
            box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1);
        }

        .form-control::placeholder {
            color: var(--text-tertiary);
            font-weight: 300;
            font-size: 0.85rem;
        }

        /* Compact Checkbox */
        .form-check {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1.2rem 0 1.5rem;
        }

        .form-check-input {
            width: 1.1rem;
            height: 1.1rem;
            border: 2px solid #cbd5e1;
            border-radius: 4px;
            cursor: pointer;
            margin: 0;
            background: white;
            transition: all 0.2s ease;
        }

        .form-check-input:checked {
            background-color: var(--navy);
            border-color: var(--navy);
            box-shadow: 0 2px 6px rgba(30, 58, 95, 0.2);
        }

        .form-check-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        /* Compact Buttons */
        .d-grid {
            display: grid;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }

        .btn-bento {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.8rem 1.5rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            cursor: pointer;
            width: 100%;
        }

        .btn-bento svg {
            width: 1.1rem;
            height: 1.1rem;
            stroke: currentColor;
        }

        .btn-bento-primary {
            background: var(--navy);
            color: white;
            box-shadow: 0 4px 10px -2px rgba(30, 58, 95, 0.3);
        }

        .btn-bento-primary:hover {
            background: var(--navy-light);
            transform: translateY(-1px);
            box-shadow: 0 6px 14px -2px rgba(30, 58, 95, 0.4);
        }

        .btn-bento-outline {
            background: transparent;
            border: 1.5px solid #e2e8f0;
            color: var(--navy);
        }

        .btn-bento-outline:hover {
            border-color: var(--navy);
            background: var(--navy-subtle);
            transform: translateY(-1px);
        }

        /* Compact Divider */
        .bento-divider {
            position: relative;
            text-align: center;
            margin: 1.2rem 0;
        }

        .bento-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #cbd5e1, transparent);
        }

        .bento-divider span {
            background: white;
            padding: 0 0.8rem;
            color: var(--text-tertiary);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }

        /* Forgot Link */
        .forgot-link {
            text-align: center;
            margin-top: 1rem;
        }

        .forgot-link a {
            color: var(--text-tertiary);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s ease;
        }

        .forgot-link a:hover {
            color: var(--navy);
        }

        /* Animation */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-up {
            animation: slideUp 0.4s ease-out forwards;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .bento-card {
                padding: 1.5rem;
            }
            
            .bento-header h2 {
                font-size: 1.6rem;
            }
        }
    </style>

    <!-- SVG Icon Definitions -->
    <svg style="display: none;">
        <defs>
            <symbol id="icon-sign-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                <polyline points="10 17 15 12 10 7"/>
                <line x1="15" y1="12" x2="3" y2="12"/>
            </symbol>
            <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </symbol>
            <symbol id="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </symbol>
            <symbol id="icon-user-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <line x1="19" y1="8" x2="19" y2="14"/>
                <line x1="22" y1="11" x2="16" y2="11"/>
            </symbol>
        </defs>
    </svg>
</head>

<body>
{% block content %}
<div class="login-container">
    <div class="bento-card fade-up">
        <!-- Compact Header -->
        <div class="bento-header">
            <div class="bento-header-icon">
                <svg><use href="#icon-sign-in"/></svg>
            </div>
            <h2>Welcome Back</h2>
            <p>Sign in to continue</p>
        </div>

        <!-- Login Form -->
        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username" class="form-label">
                    <svg><use href="#icon-user"/></svg>
                    Username
                </label>
                <input type="text" name="username" class="form-control" id="id_username"
                       placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="id_password" class="form-label">
                    <svg><use href="#icon-lock"/></svg>
                    Password
                </label>
                <input type="password" name="password" class="form-control" id="id_password"
                       placeholder="Enter your password" required>
            </div>

            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me">
                <label class="form-check-label" for="remember_me">Keep me signed in</label>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn-bento btn-bento-primary">
                    <svg><use href="#icon-sign-in"/></svg>
                    Sign In
                </button>
            </div>
        </form>

        <!-- Compact Divider -->
        <div class="bento-divider">
            <span>New here?</span>
        </div>

        <!-- Register Link -->
        <div style="text-align: center;">
            <a href="{% url 'register' %}" class="btn-bento btn-bento-outline">
                <svg><use href="#icon-user-plus"/></svg>
                Create Account
            </a>
        </div>

        <!-- Forgot Password -->
        <div class="forgot-link">
            <a href="#">Forgot password?</a>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
