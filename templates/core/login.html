{% load static %}

{% load crispy_forms_tags %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login - StudySync{% endblock %}</title>

    <!-- Bootstrap CSS (keeping for grid compatibility) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Custom CSS (overrides Bootstrap) -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #1e3a5f;
            --navy-light: #2d4b75;
            --navy-subtle: rgba(30, 58, 95, 0.05);
            --navy-soft: rgba(30, 58, 95, 0.03);
            --cream: #fdfaf7;
            --text-primary: #2c2c2c;
            --text-secondary: #5a5a5a;
            --text-tertiary: #8a8a8a;
            --border-light: rgba(0, 0, 0, 0.05);
            --border-elegant: rgba(30, 58, 95, 0.15);
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Inter', sans-serif;
            --shadow-soft: 0 10px 30px -20px rgba(0, 0, 0, 0.1);
            --shadow-bento: 0 4px 20px rgba(30, 58, 95, 0.08);
            --bento-radius: 1.5rem;
        }

        body {
            background: var(--cream);
            font-family: var(--font-sans);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            margin: 0;
            padding: 0;
        }

        .login-container {
            max-width: 450px;
            margin: 0 auto;
            padding: 1.5rem;
            width: 100%;
        }

        /* Bento Card */
        .bento-card {
            background: white;
            border-radius: var(--bento-radius);
            padding: 2.5rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-bento);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .bento-card:hover {
            border-color: var(--border-elegant);
            box-shadow: 0 8px 30px rgba(30, 58, 95, 0.12);
        }

        .bento-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--navy), var(--navy-light));
            opacity: 0.5;
        }

        /* Bento Header */
        .bento-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .bento-header-icon {
            width: 64px;
            height: 64px;
            background: var(--navy-subtle);
            border-radius: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            border: 1px solid var(--border-elegant);
        }

        .bento-header-icon svg {
            width: 2rem;
            height: 2rem;
            stroke: var(--navy);
        }

        .bento-header h2 {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 400;
            color: var(--navy);
            margin-bottom: 0.5rem;
        }

        .bento-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin: 0;
        }

        /* Form Fields */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-label svg {
            width: 1rem;
            height: 1rem;
            stroke: var(--navy);
            opacity: 0.7;
        }

        /* Elegant Input Fields */
        .form-control {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: var(--cream);
            border: 1px solid var(--border-light);
            border-radius: 1.2rem;
            font-size: 0.95rem;
            font-family: var(--font-sans);
            color: var(--text-primary);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--navy);
            background: white;
            box-shadow: 0 0 0 3px var(--navy-subtle);
        }

        .form-control::placeholder {
            color: var(--text-tertiary);
            font-weight: 300;
            opacity: 0.7;
        }

        /* Checkbox styling */
        .form-check {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .form-check-input {
            width: 1.2rem;
            height: 1.2rem;
            border: 2px solid var(--border-elegant);
            border-radius: 0.3rem;
            cursor: pointer;
            margin: 0;
            background: white;
            transition: all 0.2s ease;
        }

        .form-check-input:checked {
            background-color: var(--navy);
            border-color: var(--navy);
        }

        .form-check-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        /* Buttons */
        .d-grid {
            display: grid;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .btn-bento {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.9rem 1.8rem;
            border-radius: 1.2rem;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            cursor: pointer;
            width: 100%;
        }

        .btn-bento svg {
            width: 1.2rem;
            height: 1.2rem;
            stroke: currentColor;
        }

        .btn-bento-primary {
            background: var(--navy);
            color: white;
            box-shadow: 0 4px 12px rgba(30, 58, 95, 0.15);
        }

        .btn-bento-primary:hover {
            background: var(--navy-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 58, 95, 0.2);
        }

        .btn-bento-outline {
            background: transparent;
            border: 1px solid var(--border-elegant);
            color: var(--navy);
        }

        .btn-bento-outline:hover {
            border-color: var(--navy);
            background: var(--navy-subtle);
            transform: translateY(-2px);
        }

        /* Divider */
        .bento-divider {
            position: relative;
            text-align: center;
            margin: 2rem 0;
        }

        .bento-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-elegant), transparent);
        }

        .bento-divider span {
            background: white;
            padding: 0 1rem;
            color: var(--text-tertiary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            position: relative;
            z-index: 1;
        }

        /* Links */
        .forgot-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .forgot-link a {
            color: var(--text-tertiary);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }

        .forgot-link a:hover {
            color: var(--navy);
            text-decoration: underline;
        }

        /* Demo Accounts Card */
        .demo-card {
            background: white;
            border-radius: 1.2rem;
            padding: 1.2rem;
            border: 1px solid var(--border-light);
            margin-top: 1.5rem;
        }

        .demo-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--navy);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-light);
        }

        .demo-title svg {
            width: 1rem;
            height: 1rem;
            stroke: var(--navy);
        }

        .demo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .demo-item {
            background: var(--navy-subtle);
            border-radius: 1rem;
            padding: 0.8rem;
        }

        .demo-item strong {
            display: block;
            color: var(--navy);
            font-size: 0.8rem;
            margin-bottom: 0.3rem;
        }

        .demo-item code {
            display: block;
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.5);
            padding: 0.2rem 0.4rem;
            border-radius: 0.4rem;
            margin-bottom: 0.2rem;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 1rem;
            }
            
            .bento-card {
                padding: 1.8rem;
            }
            
            .demo-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Animation */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-up {
            animation: fadeUp 0.5s ease-out forwards;
        }
    </style>

    <!-- SVG Icon Definitions -->
    <svg style="display: none;">
        <defs>
            <symbol id="icon-sign-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                <polyline points="10 17 15 12 10 7"/>
                <line x1="15" y1="12" x2="3" y2="12"/>
            </symbol>
            <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </symbol>
            <symbol id="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </symbol>
            <symbol id="icon-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
            </symbol>
            <symbol id="icon-user-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <line x1="19" y1="8" x2="19" y2="14"/>
                <line x1="22" y1="11" x2="16" y2="11"/>
            </symbol>
            <symbol id="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="16" x2="12" y2="12"/>
                <circle cx="12" cy="8" r="0.5" fill="currentColor"/>
            </symbol>
            <symbol id="icon-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
            </symbol>
        </defs>
    </svg>
</head>

<body>
{% block content %}
<div class="login-container">
    <div class="bento-card fade-up">
        <!-- Header -->
        <div class="bento-header">
            <div class="bento-header-icon">
                <svg><use href="#icon-sign-in"/></svg>
            </div>
            <h2>Welcome Back</h2>
            <p>Sign in to continue your study journey</p>
        </div>

        <!-- Login Form -->
        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username" class="form-label">
                    <svg><use href="#icon-user"/></svg>
                    Username
                </label>
                <input type="text" name="username" class="form-control" id="id_username"
                       placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="id_password" class="form-label">
                    <svg><use href="#icon-lock"/></svg>
                    Password
                </label>
                <input type="password" name="password" class="form-control" id="id_password"
                       placeholder="Enter your password" required>
            </div>

            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me">
                <label class="form-check-label" for="remember_me">Remember me</label>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn-bento btn-bento-primary">
                    <svg><use href="#icon-sign-in"/></svg>
                    Sign In
                </button>
            </div>
        </form>

        <!-- Divider -->
        <div class="bento-divider">
            <span>New here?</span>
        </div>

        <!-- Register Link -->
        <div style="text-align: center;">
            <a href="{% url 'register' %}" class="btn-bento btn-bento-outline">
                <svg><use href="#icon-user-plus"/></svg>
                Create New Account
            </a>
        </div>

        <!-- Forgot Password -->
        <div class="forgot-link">
            <a href="#">Forgot your password?</a>
        </div>
    </div>

    
</div>
{% endblock %}
</body>
</html>
